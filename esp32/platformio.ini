; QuickFlip for the "Cheap Yellow Display" (ESP32-2432S028R: 2.8" 320x240 ILI9341, resistive
; touch, microSD slot).
;
;   pio run -t upload -t monitor     (build + flash, then show the serial log)
;
; The pins and the screen driver are in src/board.h. Other boards get an [env] of their own
; with a different QF_BOARD_... flag.

[platformio]
default_envs = cyd

[env]
platform = espressif32@6.13.0
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_unflags = -Os
build_flags = -O2 -DCORE_DEBUG_LEVEL=1
lib_deps =
  lovyan03/LovyanGFX@^1.2.7
  bblanchon/ArduinoJson@^7.2.0
  symlink://../core

[env:cyd]
board = esp32dev
board_build.partitions = huge_app.csv
build_flags = ${env.build_flags} -DQF_BOARD_CYD

; The version with two USB sockets (USB-C and micro-USB) has an ST7789 screen instead.
[env:cyd2usb]
board = esp32dev
board_build.partitions = huge_app.csv
build_flags = ${env.build_flags} -DQF_BOARD_CYD -DQF_PANEL_ST7789
